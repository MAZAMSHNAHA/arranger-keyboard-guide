<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Arranger Guide</title>
    <style>
      :root {
        --bg: #0a0c10;
        --panel: #141923;
        --panel-2: #1b2230;
        --text: #edf2f7;
        --muted: #a0aec0;
        --accent: #38bdf8;
        --accent-2: #e63946;
        --border: #263042;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        justify-content: center;
        padding: 32px 16px;
      }

      .app {
        width: min(1400px, 100%);
      }

      .header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 12px 16px;
        margin-bottom: 18px;
      }

      .brand-row, .view-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .brand-btn, .view-btn {
        border: 1px solid var(--border);
        background: rgba(255,255,255,0.03);
        color: var(--text);
        border-radius: 10px;
        padding: 9px 12px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.18s ease;
      }

      .brand-btn:hover, .view-btn:hover { border-color: var(--accent); }
      .brand-btn.active, .view-btn.active {
        background: rgba(56, 189, 248, 0.12);
        border-color: var(--accent);
        color: #dff7ff;
      }

      .builder {
        display: grid;
        grid-template-columns: 260px minmax(0, 1fr);
        gap: 18px;
      }

      .sidebar {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 16px;
      }

      .sidebar h2 {
        margin: 0 0 16px;
        font-size: 1.1rem;
      }

      .model-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 8px;
      }

      .model-item {
        border: 1px solid var(--border);
        border-radius: 10px;
        background: rgba(255,255,255,0.02);
        color: var(--text);
        cursor: pointer;
        text-align: right;
        padding: 10px 12px;
        font-weight: 700;
      }

      .model-item.active {
        border-color: var(--accent);
        background: rgba(56, 189, 248, 0.12);
      }

      .canvas-panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 18px;
      }

      .canvas-wrap {
        background: #05070a;
        border-radius: 18px;
        padding: 10px;
        border: 1px solid var(--border);
      }

      #keyboard-img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 12px;
        background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
      }

      .status {
        margin-top: 12px;
        color: var(--muted);
        font-size: 0.95rem;
      }

      @media (max-width: 900px) {
        .builder {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div>
          <strong>Interactive Arranger Guide</strong>
        </div>

        <div class="brand-row" id="brand-row" aria-label="Brand selector"></div>
      </header>

      <div class="builder">
        <aside class="sidebar">
          <h2>Models</h2>
          <ul class="model-list" id="model-list"></ul>
        </aside>

        <main class="canvas-panel">
          <div class="view-row" id="view-row" aria-label="View selector"></div>

          <div class="canvas-wrap">
            <img
              id="keyboard-img"
              src=""
              alt="Keyboard layout"
              loading="eager"
              decoding="async"
            />
          </div>

          <div class="status" id="status">Loading image…</div>
        </main>
      </div>
    </div>

    <script>
      const FALLBACK_SVG = `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
          <rect width="1600" height="900" fill="#0a0c10"/>
          <rect x="60" y="60" width="1480" height="780" rx="30" fill="#141923" stroke="#263042" stroke-width="4"/>
          <text x="800" y="420" text-anchor="middle" fill="#38bdf8" font-size="38" font-family="Arial, sans-serif" font-weight="700">Image unavailable</text>
          <text x="800" y="480" text-anchor="middle" fill="#a0aec0" font-size="24" font-family="Arial, sans-serif">Check the filename or file path</text>
        </svg>
      `)}`;

      const models = {
        Korg: [
          { name: 'Korg Pa5X', front: 'pa5x.png', rear: 'pa5x-rear.png' },
          { name: 'Korg Pa1000', front: 'pa1000.jpg', rear: 'pa1000-rear.png' },
          { name: 'Korg Pa600', front: 'pa600.png', rear: 'pa600-rear.png' },
          { name: 'Korg Pa700', front: 'pa700.png', rear: 'pa700-rear.png' },
          { name: 'Korg Pa900', front: 'pa900.png', rear: 'pa900-rear.png' }
        ],
        Yamaha: [
          { name: 'Yamaha Tyros5', front: 'tyros5.png', rear: 'tyros5-rear.png' },
          { name: 'Yamaha SX700', front: 'sx700.png', rear: 'sx700-rear.png' },
          { name: 'Yamaha SX900', front: 'sx900.png', rear: 'sx900-rear.png' },
          { name: 'Yamaha SX920', front: 'sx920.png', rear: 'sx920-rear.png' }
        ],
        Ketron: [
          { name: 'Ketron SD1+', front: 'sd1plus.jpg', rear: 'sd1plus-rear.png' },
          { name: 'Ketron Gnos', front: 'genos.png', rear: 'genos-rear.png' },
          { name: 'Ketron Gnos2', front: 'genos2.png', rear: 'genos2-rear.png' }
        ]
      };

      const brandOrder = ['Korg', 'Yamaha', 'Ketron'];
      const state = {
        brand: 'Korg',
        modelIndex: 0,
        view: 'front'
      };

      function normalizeFileName(value) {
        if (!value || typeof value !== 'string') return '';
        const trimmed = value.trim();
        if (!trimmed) return '';
        if (/^(data:|https?:|\/\/)/i.test(trimmed) || trimmed.startsWith('#')) return trimmed;
        return trimmed.replace(/^\/+/, './');
      }

      function resolveAssetPath(fileName) {
        const cleaned = normalizeFileName(fileName);
        if (!cleaned) return FALLBACK_SVG;
        const url = new URL(cleaned, window.location.href);
        return url.toString();
      }

      function imageExists(url) {
        return new Promise((resolve) => {
          const probe = new Image();
          probe.onload = () => resolve(true);
          probe.onerror = () => resolve(false);
          probe.src = url;
        });
      }

      async function safeSetImage(fileName) {
        const img = document.getElementById('keyboard-img');
        const status = document.getElementById('status');
        const resolved = resolveAssetPath(fileName);

        if (!resolved || resolved === FALLBACK_SVG) {
          img.src = FALLBACK_SVG;
          status.textContent = 'No valid image file was found for this model.';
          return;
        }

        img.decoding = 'async';
        img.loading = 'eager';

        const ok = await imageExists(resolved);
        if (ok) {
          img.src = resolved;
          status.textContent = `Showing ${state.view} view for ${currentModel().name}`;
          return;
        }

        img.src = FALLBACK_SVG;
        status.textContent = `Fallback image shown: ${currentModel().name}`;
      }

      function currentModel() {
        return models[state.brand][state.modelIndex];
      }

      function renderBrandButtons() {
        const row = document.getElementById('brand-row');
        row.innerHTML = '';

        brandOrder.forEach((brand) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'brand-btn' + (state.brand === brand ? ' active' : '');
          btn.textContent = brand;
          btn.addEventListener('click', () => {
            state.brand = brand;
            state.modelIndex = 0;
            state.view = 'front';
            renderAll();
          });
          row.appendChild(btn);
        });
      }

      function renderModelList() {
        const list = document.getElementById('model-list');
        list.innerHTML = '';

        models[state.brand].forEach((model, index) => {
          const item = document.createElement('li');
          item.type = 'button';
          item.className = 'model-item' + (index === state.modelIndex ? ' active' : '');
          item.textContent = model.name;
          item.addEventListener('click', () => {
            state.modelIndex = index;
            state.view = 'front';
            renderAll();
          });
          list.appendChild(item);
        });
      }

      function renderViewButtons() {
        const row = document.getElementById('view-row');
        row.innerHTML = '';

        ['front', 'rear'].forEach((view) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'view-btn' + (state.view === view ? ' active' : '');
          btn.textContent = view === 'front' ? 'Front panel' : 'Rear panel';
          btn.addEventListener('click', () => {
            state.view = view;
            renderAll();
          });
          row.appendChild(btn);
        });
      }

      function renderAll() {
        renderBrandButtons();
        renderModelList();
        renderViewButtons();
        const model = currentModel();
        const fileToLoad = model[state.view];
        safeSetImage(fileToLoad);
      }

      (function bootstrap() {
        const img = document.getElementById('keyboard-img');
        img.onerror = function () {
          this.src = FALLBACK_SVG;
          document.getElementById('status').textContent = 'The selected image failed to load; fallback image shown.';
        };

        renderAll();
      })();
    </script>
  </body>
</html>
